name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: irlobby
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irlobby"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/irlobby
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,api.irlobby.com
      CORS_ALLOWED_ORIGINS: https://irlobby.com,https://www.irlobby.com
      CSRF_TRUSTED_ORIGINS: https://irlobby.com,https://www.irlobby.com
      WEBSOCKET_ALLOWED_ORIGINS: https://irlobby.com,https://www.irlobby.com

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Check web client
        run: npm run check:web

      - name: Install Playwright browsers
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Run web E2E tests
        run: npm --prefix apps/web run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Check mobile client
        run: npm --prefix apps/mobile run typecheck

      - name: Run mobile tests
        run: npm --prefix apps/mobile test -- --ci --passWithNoTests --forceExit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev binutils libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r irlobby_backend/requirements.txt

      - name: Enable PostGIS
        run: |
          psql "postgres://postgres:postgres@localhost:5432/irlobby" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run Django checks
        working-directory: irlobby_backend
        run: |
          python manage.py check
          python manage.py check --deploy

      - name: Security scans
        working-directory: irlobby_backend
        run: |
          bandit -r . -x './tests,./users/tests.py,./activities/tests.py,./swipes/tests.py,./matches/tests.py,./reviews/tests.py,./moderation/tests.py,./chat/tests.py,./utils/test_sanitize.py,./test_password_reset.py' --severity-level high
          safety check || true

      - name: Lint (ruff)
        run: |
          ruff check . --config pyproject.toml

      - name: Format check (black)
        run: |
          black --check . --config pyproject.toml

      - name: Type check (mypy)
        working-directory: irlobby_backend
        run: |
          mypy . --config-file ../pyproject.toml

      - name: Run tests (pytest)
        run: |
          pytest

      - name: Upload backend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            irlobby_backend/coverage.xml
            irlobby_backend/htmlcov
          if-no-files-found: error

      - name: Lint Python (optional)
        working-directory: irlobby_backend
        run: |
          python -m py_compile $(find . -name "*.py") || true

  mobile-e2e:
    name: Mobile E2E (Maestro iOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
      EXPO_PUBLIC_WEBSOCKET_URL: ws://127.0.0.1:8000/ws
      EXPO_PUBLIC_TWITTER_CLIENT_ID: ci-twitter-client
      EXPO_PUBLIC_TWITTER_REDIRECT_URI: irlobby://auth/twitter
      EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN: pk.ci-mapbox-token

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Select iOS simulator
        working-directory: apps/mobile
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const devices = JSON.parse(execSync('xcrun simctl list devices available -j', { encoding: 'utf8' })).devices;
          const allDevices = Object.values(devices).flat();
          const selected =
            allDevices.find((device) => device.name === 'iPhone 16') ||
            allDevices.find((device) => device.name === 'iPhone 15') ||
            allDevices.find((device) => device.name.startsWith('iPhone'));

          if (!selected) {
            throw new Error('No available iPhone simulator was found.');
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `IOS_SIMULATOR_UDID=${selected.udid}\n`);
          console.log(`Selected ${selected.name} (${selected.udid})`);
          EOF

      - name: Build iOS simulator app
        working-directory: apps/mobile
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
          xcodebuild \
            -workspace ios/IRLobby.xcworkspace \
            -scheme IRLobby \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run mobile E2E tests
        working-directory: apps/mobile
        run: |
          app_path=$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 2 -name "IRLobby.app" -print -quit)
          if [ -z "$app_path" ]; then
            echo "Could not find the built iOS simulator app."
            exit 1
          fi

          xcrun simctl install "$IOS_SIMULATOR_UDID" "$app_path"
          maestro test e2e
