[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(\
  \.git
  | \.venv
  | node_modules
  | apps
  | packages
  | dist
  | build
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["irlobby_backend"]
extend-exclude = [
  "apps",
  "packages",
  "node_modules",
  "dist",
  "build",
  "irlobby_backend/**/migrations/*",
]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = [
  "activities",
  "chat",
  "irlobby_backend",
  "matches",
  "messages",
  "moderation",
  "reviews",
  "swipes",
  "users",
  "utils",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = "(^|/)(migrations|\\.agents)/"
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = [
  "activities",
  "chat",
  "irlobby_backend",
  "matches",
  "moderation",
  "reviews",
  "swipes",
  "users",
  "utils",
]
omit = [
  "*/tests.py",
  "*/test_*.py",
  "*/migrations/*",
  "*/admin.py",
  "*/apps.py",
  "*/asgi.py",
  "*/wsgi.py",
  "*/celery.py",
  "*/settings.py",
  "*/urls.py",
  "*/routing.py",
  "*/manage.py",
  "*/query_db.py",
  "*/management/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
