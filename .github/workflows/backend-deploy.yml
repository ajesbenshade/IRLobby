name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      ensure_apple_audience:
        description: Ensure APPLE_OAUTH_AUDIENCES=com.irlobby.app in .env.production
        type: boolean
        default: true
      mode:
        description: Deploy mode
        type: choice
        options:
          - hotpatch
          - full
        default: hotpatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Resolve SSH user and sync + deploy
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          ENSURE_APPLE_AUDIENCE: ${{ inputs.ensure_apple_audience }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          connect() {
            local user="$1"
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "${user}@${SSH_HOST}" "$2"
          }

          EFFECTIVE_USER=""
          for candidate in root "${SSH_USER}" ubuntu opc admin deploy; do
            if connect "${candidate}" "echo ok"; then
              EFFECTIVE_USER="${candidate}"
              break
            fi
          done

          if [ -z "${EFFECTIVE_USER}" ]; then
            echo "SSH failed for all attempted users" >&2
            exit 1
          fi

          echo "Connected as ${EFFECTIVE_USER}"

          REMOTE_DIR="$(connect "${EFFECTIVE_USER}" 'for dir in /opt/irlobby/irlobby_backend ~/IRLobby/irlobby_backend; do [ -d "$dir" ] && echo "$dir" && exit 0; done; exit 1')"
          echo "Remote dir: ${REMOTE_DIR}"

          rsync -az \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude '.env.local' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'staticfiles' \
            --exclude 'media' \
            --exclude '.git' \
            ./irlobby_backend/ \
            "${EFFECTIVE_USER}@${SSH_HOST}:${REMOTE_DIR}/"

          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "${EFFECTIVE_USER}@${SSH_HOST}" \
            "REMOTE_DIR='${REMOTE_DIR}' ENSURE_APPLE_AUDIENCE='${ENSURE_APPLE_AUDIENCE}' DEPLOY_MODE='${DEPLOY_MODE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${REMOTE_DIR}"

          if [ ! -f .env.production ]; then
            echo "Missing .env.production" >&2
            exit 1
          fi

          if [ "${ENSURE_APPLE_AUDIENCE}" = "true" ]; then
            if grep -q '^APPLE_OAUTH_AUDIENCES=' .env.production; then
              sed -i 's/^APPLE_OAUTH_AUDIENCES=.*/APPLE_OAUTH_AUDIENCES=com.irlobby.app/' .env.production
            else
              printf '\nAPPLE_OAUTH_AUDIENCES=com.irlobby.app\n' >> .env.production
            fi
          fi

          if ! grep -q '^GOOGLE_OAUTH_CLIENT_IDS=' .env.production; then
            printf '\nGOOGLE_OAUTH_CLIENT_IDS=\n' >> .env.production
            echo "Added empty GOOGLE_OAUTH_CLIENT_IDS placeholder (fill with real client IDs)."
          fi

          chmod 600 .env.production

          web_cid="$(docker ps -q -f name=irlobby_backend-web-1 | head -1 || true)"
          ws_cid="$(docker ps -q -f name=irlobby_backend-ws-1 | head -1 || true)"
          if [ -z "${web_cid}" ]; then
            echo "web container not running" >&2
            docker ps --format 'table {{.Names}}\t{{.Status}}' || true
            exit 1
          fi

          echo "=== hotpatching Python app into running containers ==="
          docker cp ./users/. "${web_cid}:/app/users/"
          docker cp ./irlobby_backend/. "${web_cid}:/app/irlobby_backend/"
          if [ -n "${ws_cid}" ]; then
            docker cp ./users/. "${ws_cid}:/app/users/"
            docker cp ./irlobby_backend/. "${ws_cid}:/app/irlobby_backend/"
          fi

          # Ensure Apple audience is present in the running web process env for this restart.
          # Compose restart keeps existing container env; also write into a local override file
          # that Django reads via python-decouple/.env if present.
          if [ "${ENSURE_APPLE_AUDIENCE}" = "true" ]; then
            docker exec "${web_cid}" sh -lc 'grep -q "^APPLE_OAUTH_AUDIENCES=" /app/.env 2>/dev/null || echo "APPLE_OAUTH_AUDIENCES=com.irlobby.app" >> /app/.env'
            docker exec "${web_cid}" sh -lc 'grep -q "^GOOGLE_OAUTH_CLIENT_IDS=" /app/.env 2>/dev/null || echo "GOOGLE_OAUTH_CLIENT_IDS=" >> /app/.env'
            if [ -n "${ws_cid}" ]; then
              docker exec "${ws_cid}" sh -lc 'grep -q "^APPLE_OAUTH_AUDIENCES=" /app/.env 2>/dev/null || echo "APPLE_OAUTH_AUDIENCES=com.irlobby.app" >> /app/.env'
              docker exec "${ws_cid}" sh -lc 'grep -q "^GOOGLE_OAUTH_CLIENT_IDS=" /app/.env 2>/dev/null || echo "GOOGLE_OAUTH_CLIENT_IDS=" >> /app/.env'
            fi
          fi

          echo "=== restarting web/ws to load new routes ==="
          docker restart "${web_cid}"
          if [ -n "${ws_cid}" ]; then
            docker restart "${ws_cid}"
          fi
          sleep 8

          if [ "${DEPLOY_MODE}" = "full" ]; then
            echo "Full rebuild requested but REDIS_PASSWORD recovery is fragile; hotpatch completed first."
            echo "Run a manual full deploy on the host when REDIS_PASSWORD is present in .env.production."
          fi

          echo "=== container status ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}' | head -20
          REMOTE

      - name: Verify auth routes
        run: |
          set -euo pipefail

          echo "Waiting for web to become ready..."
          for attempt in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 15 https://api.irlobby.com/api/health/ || true)"
            echo "health attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              break
            fi
            sleep 5
          done

          echo "=== twitter status ==="
          curl -sS --max-time 20 https://api.irlobby.com/api/auth/twitter/status/
          echo ""

          echo "=== google mobile (expect JSON 400/503, not HTML 404) ==="
          google_code="$(curl -sS -o /tmp/google.json -w "%{http_code}" --max-time 20 \
            -X POST https://api.irlobby.com/api/auth/google/mobile/ \
            -H 'Content-Type: application/json' \
            -d '{"id_token":"invalid"}')"
          echo "HTTP ${google_code}"
          head -c 300 /tmp/google.json || true
          echo ""
          if [ "${google_code}" = "404" ]; then
            echo "Google mobile route still missing (404)" >&2
            exit 1
          fi

          echo "=== apple mobile (expect JSON 400/503, not HTML 404) ==="
          apple_code="$(curl -sS -o /tmp/apple.json -w "%{http_code}" --max-time 20 \
            -X POST https://api.irlobby.com/api/auth/apple/mobile/ \
            -H 'Content-Type: application/json' \
            -d '{"identity_token":"invalid"}')"
          echo "HTTP ${apple_code}"
          head -c 300 /tmp/apple.json || true
          echo ""
          if [ "${apple_code}" = "404" ]; then
            echo "Apple mobile route still missing (404)" >&2
            exit 1
          fi

          echo "Auth route verification passed."
