[pytest]
DJANGO_SETTINGS_MODULE = irlobby_backend.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = irlobby_backend
addopts =
	-ra
	--cov=activities
	--cov=chat
	--cov=irlobby_backend
	--cov=matches
	--cov=moderation
	--cov=reviews
	--cov=swipes
	--cov=users
	--cov=utils
	--cov-report=term-missing
	--cov-report=xml:irlobby_backend/coverage.xml
	--cov-report=html:irlobby_backend/htmlcov
	--cov-fail-under=80
testpaths = irlobby_backend
